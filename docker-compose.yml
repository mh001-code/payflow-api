services:
  postgres:
    image: postgres:16-alpine
    container_name: payflow-db
    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow_user
      POSTGRES_PASSWORD: payflow_pass
    ports:
      - "5432:5432"
    volumes:
      - payflow_data:/var/lib/postgresql/data

volumes:
  payflow_data: